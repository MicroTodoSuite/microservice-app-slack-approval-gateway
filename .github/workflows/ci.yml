name: ci

# Not a caller into .github's reusable ci.yml: that pipeline builds, scans, and
# publishes a Docker image to ECR, and this repo ships a zip-based Lambda
# bundle instead (see CLAUDE.md). Kept deliberately simple: install, audit,
# test, build. microservice-app-ops owns turning a reviewed build into a
# deployed Lambda (Terraform, human-applied, same discipline as every other
# root there).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build Lambda bundles
        run: npm run build

      - name: Retain the built bundles as evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambda-bundles-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
